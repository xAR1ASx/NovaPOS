name: Compilar NovaPOS (.exe e Instalador Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Restaurar configuración de Firebase desde Secrets
        shell: pwsh
        env:
          FIREBASE_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if ($env:FIREBASE_B64) {
            [System.IO.File]::WriteAllBytes("lib/firebase_options.dart", [System.Convert]::FromBase64String($env:FIREBASE_B64))
            Write-Host "Restaurado lib/firebase_options.dart con éxito."
          }
          if ($env:GOOGLE_SERVICES_B64) {
            [System.IO.File]::WriteAllBytes("android/app/google-services.json", [System.Convert]::FromBase64String($env:GOOGLE_SERVICES_B64))
            Write-Host "Restaurado android/app/google-services.json con éxito."
          }

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpiar hooks locales de macOS en pubspec.yaml
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          $filtered = $lines | Where-Object { 
            $_ -notmatch "hooks:" -and 
            $_ -notmatch "user_defines:" -and 
            $_ -notmatch "sqlite3:" -and 
            $_ -notmatch "source:\s*system" -and
            $_ -notmatch "LOCAL \(Mac\)"
          }
          $filtered | Set-Content pubspec.yaml

      - name: Obtener dependencias
        run: flutter pub get

      - name: Ejecutar pruebas automáticas
        run: flutter test

      - name: Compilar aplicación Windows en Release
        run: flutter build windows --release

      # Las DLL de Visual C++ van junto a NovaPOS.exe: Windows las usa antes que
      # las del sistema, y un PC con una versión vieja (ej. 14.29) cerraba la
      # app al iniciar sesión (falla en MSVCP140.dll).
      - name: Incluir Visual C++ Runtime junto a la app
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object { $_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $crt) { throw "No se encontró el Visual C++ Runtime en $vs" }
          Write-Host "Copiando desde $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" "build\windows\x64\runner\Release\"
          Get-ChildItem "build\windows\x64\runner\Release\*140*.dll" |
            ForEach-Object { Write-Host "$($_.Name) $($_.VersionInfo.FileVersion)" }

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Generar Instalador con Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NovaPOS_setup.iss

      - name: Subir Instalador como Artefacto descargable
        uses: actions/upload-artifact@v5
        with:
          name: NovaPOS-Windows-Setup-1.9.2
          path: installer/output/*.exe
          retention-days: 30
