name: Compilar NovaPOS (.exe e Instalador Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Restaurar configuración de Firebase desde Secrets
        shell: pwsh
        env:
          FIREBASE_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if ($env:FIREBASE_B64) {
            [System.IO.File]::WriteAllBytes("lib/firebase_options.dart", [System.Convert]::FromBase64String($env:FIREBASE_B64))
            Write-Host "Restaurado lib/firebase_options.dart con éxito."
          }
          if ($env:GOOGLE_SERVICES_B64) {
            [System.IO.File]::WriteAllBytes("android/app/google-services.json", [System.Convert]::FromBase64String($env:GOOGLE_SERVICES_B64))
            Write-Host "Restaurado android/app/google-services.json con éxito."
          }

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Limpiar hooks locales de macOS en pubspec.yaml
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          $filtered = $lines | Where-Object { 
            $_ -notmatch "hooks:" -and 
            $_ -notmatch "user_defines:" -and 
            $_ -notmatch "sqlite3:" -and 
            $_ -notmatch "source:\s*system" -and
            $_ -notmatch "LOCAL \(Mac\)"
          }
          $filtered | Set-Content pubspec.yaml

      - name: Obtener dependencias
        run: flutter pub get

      - name: Ejecutar pruebas automáticas
        run: flutter test

      - name: Compilar aplicación Windows en Release
        run: flutter build windows --release

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Generar Instalador con Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NovaPOS_setup.iss

      - name: Subir Instalador como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: NovaPOS-Windows-Setup-1.8.1
          path: installer/output/*.exe
          retention-days: 30
